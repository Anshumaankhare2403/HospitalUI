    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <path d="M 0,-3 C -2.5,-6.5 -6.5,-3.5 -4.5,1 C -3.5,3.2 0,5.8 0,5.8 C 0,5.8 3.5,3.2 4.5,1 C 6.5,-3.5 2.5,-6.5 0,-3 Z" fill="#0E1758" />
