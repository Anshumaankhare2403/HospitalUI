    <path id="bottomSealArc" d="M 140,80 A 60,60 0 0,1 20,80" fill="none" />
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
