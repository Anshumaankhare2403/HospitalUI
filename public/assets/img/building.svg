<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1452"/>
      <stop offset="60%" stop-color="#1c2b8f"/>
      <stop offset="100%" stop-color="#3044b5"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2ebf8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76a5e8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3d68b8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d42a31"/>
      <stop offset="100%" stop-color="#f2b733"/>
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Modern Hospital Main Tower -->
  <rect x="220" y="90" width="360" height="340" rx="16" fill="url(#bldgGrad)"/>
  
  <!-- Decorative Architectural Fins -->
  <rect x="200" y="160" width="16" height="270" rx="4" fill="#1c2b8f" opacity="0.8"/>
  <rect x="584" y="160" width="16" height="270" rx="4" fill="#1c2b8f" opacity="0.8"/>
  
  <!-- Hospital Brand Canopy & Cross -->
  <rect x="260" y="60" width="280" height="40" rx="8" fill="#0e1758"/>
  <circle cx="310" cy="80" r="14" fill="#d42a31"/>
  <path d="M307,75 L313,75 M310,72 L310,88 M305,80 L315,80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="334" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">VASUDEV HOSPITAL</text>
  
  <!-- Glass Curtain Wall & Windows -->
  <g fill="url(#glassGrad)">
    <!-- Floor 4 -->
    <rect x="250" y="120" width="60" height="40" rx="4"/>
    <rect x="330" y="120" width="60" height="40" rx="4"/>
    <rect x="410" y="120" width="60" height="40" rx="4"/>
    <rect x="490" y="120" width="60" height="40" rx="4"/>
    
    <!-- Floor 3 -->
    <rect x="250" y="180" width="60" height="40" rx="4"/>
    <rect x="330" y="180" width="60" height="40" rx="4"/>
    <rect x="410" y="180" width="60" height="40" rx="4"/>
    <rect x="490" y="180" width="60" height="40" rx="4"/>
    
    <!-- Floor 2 -->
    <rect x="250" y="240" width="60" height="40" rx="4"/>
    <rect x="330" y="240" width="60" height="40" rx="4"/>
    <rect x="410" y="240" width="60" height="40" rx="4"/>
    <rect x="490" y="240" width="60" height="40" rx="4"/>
    
    <!-- Floor 1 -->
    <rect x="250" y="300" width="60" height="40" rx="4"/>
    <rect x="330" y="300" width="60" height="40" rx="4"/>
    <rect x="410" y="300" width="60" height="40" rx="4"/>
    <rect x="490" y="300" width="60" height="40" rx="4"/>
  </g>
  
  <!-- Ground Level Emergency Bay & Entrance Canopy -->
  <rect x="160" y="360" width="480" height="70" rx="12" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.15))"/>
  <rect x="180" y="360" width="200" height="12" rx="4" fill="url(#accentGrad)"/>
  <text x="190" y="395" fill="#d42a31" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">EMERGENCY &amp; TRAUMA 24×7</text>
  
  <!-- Sliding Glass Doors Entrance -->
  <rect x="420" y="380" width="100" height="50" rx="4" fill="#1c2b8f" opacity="0.9"/>
  <line x1="470" y1="380" x2="470" y2="430" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Ground Foreground & Tree Silhouettes -->
  <rect x="0" y="420" width="800" height="80" fill="#091238"/>
  <rect x="0" y="440" width="800" height="60" fill="#060c26"/>
  <circle cx="120" cy="420" r="30" fill="#1c2b8f" opacity="0.6"/>
  <circle cx="680" cy="420" r="35" fill="#1c2b8f" opacity="0.6"/>
</svg>
